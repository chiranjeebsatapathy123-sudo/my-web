{% extends "base.html" %}
{% block content %}
<h2 class="text-white">Document Summary: {{ doc.title }}</h2>
<a href="{% url 'document_list' %}" class="btn btn-outline-secondary mb-3">Back to Documents</a>
<div class="glass-card text-light markdown-content" id="md-content">{{ summary|escapejs }}</div>
<script>document.getElementById('md-content').innerHTML = marked.parse(document.getElementById('md-content').innerHTML);</script>
{% endblock %}
