{% extends "base.html" %}

{% block title %}Verify Identity - Two-Factor Authentication{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card text-center p-4 p-md-5">
            <div class="mb-3">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-2" style="width: 80px; height: 80px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3);">
                    <i class="bi bi-shield-lock-fill text-warning display-5"></i>
                </div>
            </div>
            
            <h3 class="fw-bold text-white mb-2">2FA Verification</h3>
            <p class="text-secondary small mb-4">Please enter the 6-digit verification code from your authenticator app to access your vault.</p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="text" name="token" class="form-control bg-dark text-white border-secondary form-control-lg text-center font-monospace fs-3 py-2" placeholder="000000" maxlength="6" autofocus required autocomplete="off" style="letter-spacing: 0.3em;">
                </div>
                
                <button type="submit" class="btn btn-premium w-100 py-3 fw-bold fs-6 mb-3">
                    <i class="bi bi-shield-check me-2"></i> Verify & Proceed
                </button>

                <a href="{% url 'logout' %}" class="btn btn-premium-outline w-100 py-2 small">
                    <i class="bi bi-box-arrow-left me-1"></i> Cancel & Sign Out
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
