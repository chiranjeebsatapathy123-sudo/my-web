{% extends "base.html" %}
{% block content %}
<div class="glass-card col-md-6 mx-auto mt-4">
    <h3 class="text-white"><i class="bi bi-link-45deg text-info me-2"></i>Create Secure Link</h3>
    <form method="post" class="mt-3">{% csrf_token %}
        <select name="target_type" class="form-select bg-dark text-white mb-3" required><option value="project">Project</option><option value="resume">Resume</option></select>
        <input type="number" name="target_id" class="form-control bg-dark text-white mb-3" placeholder="Target ID (Check URLs)" required>
        <input type="number" name="days" class="form-control bg-dark text-white mb-3" placeholder="Expires in (Days)" value="7" required>
        <button type="submit" class="btn btn-premium w-100">Generate Link</button>
    </form>
</div>
{% endblock %}
