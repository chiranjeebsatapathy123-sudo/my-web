{% extends "base.html" %}

{% block page_title %}Add Secret{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card">
            <h3 class="mb-4 fw-bold"><i class="bi bi-shield-lock-fill text-warning me-2"></i>Add New Secret</h3>
            
            <form method="post" action="{% url 'add_secret' %}">
                {% csrf_token %}
                
                <div class="form-group-premium">
                    <label for="title" class="form-label">Secret Title</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="title" name="title" required placeholder="e.g. OpenAI API Key" style="border-radius: 10px;">
                </div>
                
                <div class="form-group-premium">
                    <label for="content" class="form-label">Secret Content</label>
                    <textarea class="form-control bg-dark text-light border-secondary" id="content" name="content" rows="6" required placeholder="Paste your secret key or private notes here..." style="border-radius: 10px; font-family: monospace;"></textarea>
                    <small class="text-secondary mt-1 d-block"><i class="bi bi-info-circle me-1"></i> This information will be stored securely in your vault.</small>
                </div>
                
                <div class="d-flex justify-content-end mt-4 pt-2">
                    <a href="{% url 'secrets' %}" class="btn btn-premium-outline me-2">Cancel</a>
                    <button type="submit" class="btn btn-premium"><i class="bi bi-save me-2"></i>Save Secret</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
