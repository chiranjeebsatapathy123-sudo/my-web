{% extends "base.html" %}
{% block content %}
<div class="glass-card">
    <h3 class="text-white mb-4"><i class="bi bi-shield-lock text-success me-2"></i>Security Audit Log</h3>
    <table class="table table-dark table-striped">
        <thead><tr><th>Time</th><th>Action</th><th>IP Address</th></tr></thead>
        <tbody>
            {% for log in logs %}
            <tr><td>{{ log.timestamp }}</td><td>{{ log.action }}</td><td>{{ log.ip_address }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
